<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title description">
  <title id="title">Leaf study</title>
  <desc id="description">An illustrated crop leaf with visible discoloration, used to introduce the image based Plant Disease Detection project.</desc>
  <defs>
    <radialGradient id="background" cx="70%" cy="38%" r="85%"><stop stop-color="#485e47"/><stop offset=".55" stop-color="#20372d"/><stop offset="1" stop-color="#0a1714"/></radialGradient>
    <linearGradient id="leaf" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#173428"/><stop offset=".55" stop-color="#5b8550"/><stop offset="1" stop-color="#a4a66d"/></linearGradient>
    <radialGradient id="spot"><stop stop-color="#d3985a"/><stop offset=".7" stop-color="#79553b"/><stop offset="1" stop-color="#42674a"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".4" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer></filter>
  </defs>
  <rect width="800" height="520" fill="url(#background)"/>
  <path d="M842 24C618 11 315 130 108 559c228-27 486-152 734-535Z" fill="url(#leaf)"/>
  <path d="M112 526C285 311 479 174 808 45" stroke="#cad393" stroke-width="7" opacity=".57" fill="none"/>
  <g fill="none" stroke="#bfd08a" stroke-width="4" opacity=".42"><path d="M277 360c-11-99-21-166-51-222"/><path d="M405 259c11-66 12-116-3-184"/><path d="M518 184c62 20 113 19 170 1"/><path d="M213 417c75 27 140 31 214 16"/></g>
  <ellipse cx="565" cy="258" rx="98" ry="53" transform="rotate(-22 565 258)" fill="url(#spot)" opacity=".86"/>
  <g fill="#6d5539" opacity=".62"><circle cx="505" cy="274" r="7"/><circle cx="535" cy="230" r="6"/><circle cx="597" cy="248" r="8"/><circle cx="610" cy="273" r="5"/><circle cx="553" cy="289" r="4"/></g>
  <rect width="800" height="520" filter="url(#grain)"/>
</svg>
